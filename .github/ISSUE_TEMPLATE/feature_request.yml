name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: What’s annoying or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      placeholder: How should it work?
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      placeholder: Mockups, examples, etc. (optional)
    validations:
      required: false
